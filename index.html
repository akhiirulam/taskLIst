<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Leave Request Form</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: bisque;
        font-family: Arial, sans-serif;
      }

      .form-container {
        width: 100%;
        max-width: 600px;
        padding: 24px;
        background-color: #fff;
        border-radius: 8px;
        box-shadow: 0 1px 5px rgba(0, 0, 0, 0.5);
      }

      h2 {
        text-align: center;
        margin-bottom: 20px;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      label {
        font-weight: 600;
      }

      input,
      textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 16px;
      }

      textarea {
        min-height: 120px;
        resize: vertical;
      }

      button {
        padding: 12px;
        border: none;
        border-radius: 4px;
        background-color: #007bff;
        color: white;
        font-size: 16px;
        cursor: pointer;
      }

      button:hover {
        opacity: 0.9;
      }
    </style>
  </head>

  <body>
    <div class="form-container">
      <h2>Leave Request Form</h2>

      <form method="POST" action="/formSubmit">
        <label for="employeeName">Employee Name</label>
        <input
          type="text"
          id="employeeName"
          name="employeeName"
          placeholder="Enter your name"
          required
        />

        <label for="reason">Leave Reason</label>
        <textarea
          id="reason"
          name="leaveReason"
          placeholder="Enter the reason for your leave"
          required
        ></textarea>

        <button type="submit">Submit Request</button>
      </form>
    </div>
  </body>
</html>
