<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Image Gallery</title>
    <style>
      #gallery {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }
      #gallery img {
        width: 50%;
        height: 50%;
        object-fit: cover;
        border-radius: 8px;
      }
    </style>
  </head>
  <body>
    <h1>Images</h1>
    <div id="gallery"></div>

    <script>
      async function loadImages() {
        try {
          const response = await fetch("http://localhost:5500/api/fileDisplay");

          const imageURLs = await response.json();

          const gallery = document.getElementById("gallery");
          gallery.innerHTML = "";

          imageURLs.forEach((url) => {
            const img = document.createElement("img");

            img.src = url;
            img.alt = "image";
            gallery.appendChild(img);
          });
        } catch (error) {
          console.error("Error fetching images:", error);
        }
      }

      loadImages();
    </script>
  </body>
</html>
