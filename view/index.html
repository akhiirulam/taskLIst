<!doctype html>
<html>
  <head>
    <title>File Upload</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 500px;
        margin: 50px auto;
        padding: 20px;
      }
      .container {
        border: 2px dashed #ccc;
        padding: 30px;
        text-align: center;
      }
      input[type="file"] {
        margin: 20px 0;
      }
      button {
        background: #4caf50;
        color: white;
        padding: 10px 20px;
        border: none;
        cursor: pointer;
      }
      button:hover {
        background: #45a049;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Upload File</h1>
      <form
        action="/api/uploadFile"
        method="POST"
        enctype="multipart/form-data"
      >
        <input type="file" name="file" required />
        <br />
        <input
          type="text"
          name="description"
          placeholder="File description (optional)"
        />
        <br /><br />
        <button type="submit">Upload</button>
      </form>
    </div>
  </body>
</html>
